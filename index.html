<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1F2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RideLedger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<title>RideLedger V5 - Uber &amp; DiDi bookkeeping</title>
<style>
:root{
  --paper:#EDF0F3;--surface:#FFFFFF;--surface2:#F5F7F9;--ink:#0F1F2E;--ink2:#526273;--line:#D8DFE6;
  --keep:#0B7A55;--fee:#7A5AC8;--exp:#C4432F;--gst:#B7791F;--accent:#1F4FD8;--accent-ink:#FFFFFF;
  --uber:#1A1A1A;--didi:#F26A21;--warnbg:#FFF6DD;--warnink:#7A5200;--errbg:#FDE8E4;--errink:#8C2415;--scrim:rgba(10,20,30,.55);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1620;--surface:#15212D;--surface2:#1B2937;--ink:#E9EEF3;--ink2:#9DAEBF;--line:#28394B;
    --keep:#3FD6A0;--fee:#B9A0F5;--exp:#F3826D;--gst:#EDB75C;--accent:#7FA3FF;--accent-ink:#0C1620;
    --uber:#DCE2E8;--didi:#FF8A4C;--warnbg:#3A2F14;--warnink:#F1D08A;--errbg:#3C1D18;--errink:#F8B4A8;--scrim:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --paper:#0C1620;--surface:#15212D;--surface2:#1B2937;--ink:#E9EEF3;--ink2:#9DAEBF;--line:#28394B;
  --keep:#3FD6A0;--fee:#B9A0F5;--exp:#F3826D;--gst:#EDB75C;--accent:#7FA3FF;--accent-ink:#0C1620;
  --uber:#DCE2E8;--didi:#FF8A4C;--warnbg:#3A2F14;--warnink:#F1D08A;--errbg:#3C1D18;--errink:#F8B4A8;--scrim:rgba(0,0,0,.65);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--body);padding-bottom:calc(150px)}
body.lock{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}h3{font-size:17px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2);font-size:14px;margin:4px 0 0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:20px}
.brand svg{width:30px;height:30px;border-radius:9px;background:#0F1F2E;color:#fff;padding:5px}
.pnav{display:flex;align-items:center;gap:2px}
.pnav button{width:38px;height:38px;border:0;border-radius:10px;background:transparent;font-size:22px;line-height:1}
.pnav button:disabled{opacity:.25;cursor:default}
#pLabel{min-width:120px;text-align:center;font-weight:600;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;max-width:760px;margin:8px auto 0;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--surface);border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid var(--line)}

/* hero */
.hero{padding:22px 20px 20px}
.hero .lbl{margin:0;font-weight:600;color:var(--ink2);font-size:15px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(44px,14vw,64px);line-height:1;letter-spacing:-.03em;margin:6px 0 4px;color:var(--keep)}
.big.neg{color:var(--exp)}
.hero .sub{margin:0 0 18px;color:var(--ink2);font-size:15px}
.bar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.bar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:16px 0 0;padding:0}
.legend div{display:flex;flex-direction:column;gap:2px}
.legend dt{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2)}
.legend dt b{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend dd{margin:0;font-weight:700;font-size:18px}
.insight{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:15px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--warnbg);color:var(--warnink);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.banner button{border:0;border-radius:10px;background:var(--warnink);color:var(--warnbg);font-weight:700;padding:8px 12px;white-space:nowrap}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:112px}
.tile svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:16px;line-height:1.2}
.tile small{color:var(--ink2);font-size:13px;line-height:1.3}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 2px;font-size:15px}
.center{text-align:center;margin-bottom:14px}

/* platforms */
.plat{display:grid;gap:16px}
.plat-row .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}
.plat-row .head span:first-child{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--ink2);flex:none}
.dot.uber{background:var(--uber)}.dot.didi{background:var(--didi)}
.track{height:8px;border-radius:999px;background:var(--surface2);margin:8px 0 6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:999px}
.plat-row small{color:var(--ink2);font-size:13px}

/* records */
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"],.seg label:has(input:checked){background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg label{flex:1;text-align:center;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14px;cursor:pointer;display:block}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:1px}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools .chips{margin:0;flex:none}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:13px 2px}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main small{color:var(--ink2);font-size:13px}
.amt{font-weight:700;white-space:nowrap}
.amt.inc{color:var(--keep)}.amt.exp{color:var(--ink)}
.empty{padding:28px 8px;text-align:center;color:var(--ink2)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;text-align:left}
.rcard img{width:100%;height:120px;object-fit:cover;display:block}
.rcard div{padding:9px 11px}
.rcard b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard small{color:var(--ink2);font-size:12.5px}

/* gst */
.gst-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.gst-grid>div{background:var(--surface2);border-radius:14px;padding:13px}
.gst-grid span{display:block;font-size:13px;color:var(--ink2)}
.gst-grid strong{display:block;margin-top:4px;font-size:21px;font-family:var(--display)}
.gst-grid .pay{grid-column:1/-1;background:var(--ink);color:var(--paper)}
.gst-grid .pay span{color:inherit;opacity:.75}
.gst-grid .pay strong{font-size:32px}
.note{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--warnbg);color:var(--warnink);font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--ink);color:var(--paper);min-height:46px}
.btn.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--errbg);color:var(--errink)}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

/* nav + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:6px 2px;font-size:12px;font-weight:600;color:var(--ink2);border-radius:12px}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:29;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:16px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(640px,100%);max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;outline:0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.x{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface2);font-size:20px;line-height:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--ink2)}
.field .with{display:flex;gap:8px}
.field .with button{border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:0 12px;font-weight:700;font-size:14px;white-space:nowrap}
.amount-in{font-family:var(--display);font-size:30px!important;font-weight:700;padding:12px 14px!important}
.plats{display:flex;gap:8px;flex-wrap:wrap}
.plats label{border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.plats label:has(input:checked){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.plats input{position:absolute;opacity:0;pointer-events:none}
.plats label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.err{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--errbg);color:var(--errink);font-size:14px;font-weight:600}
.sticky-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.sticky-actions .btn{flex:1}
.preview{background:var(--surface2);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px}
.preview div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.preview b{font-weight:600}
.chip-note{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;margin:0 0 12px}
details{margin-top:14px}
summary{cursor:pointer;font-weight:600;color:var(--ink2);font-size:14px}
.text-preview{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:180px;overflow:auto;font-size:12px;margin-top:8px}
.shot{width:100%;max-height:34vh;object-fit:contain;border-radius:14px;background:var(--surface2);margin-bottom:14px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:6px 0 12px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:90%;text-align:center}
.dlg-card{background:var(--surface);border-radius:20px;padding:20px;width:min(420px,calc(100% - 32px));margin:auto}
.scrim.center-scrim{align-items:center;z-index:60}
.dlg-card p{margin:8px 0 0;color:var(--ink2)}
.dlg-card .sticky-actions{margin-top:20px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;font-weight:700;text-align:right}
@media (max-width:420px){.form{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><rect x="2" y="13" width="28" height="10" rx="4"/><rect x="9" y="7" width="14" height="8"/><circle cx="9" cy="24" r="3"/><circle cx="23" cy="24" r="3"/></svg>
      <span>RideLedger</span>
    </div>
    <div class="pnav">
      <button id="pPrev" aria-label="Previous period">&#8249;</button>
      <div id="pLabel" aria-live="polite"></div>
      <button id="pNext" aria-label="Next period">&#8250;</button>
    </div>
  </div>
  <div class="chips" id="ranges">
    <button class="chip" data-range="week" aria-pressed="false">Week</button>
    <button class="chip" data-range="month" aria-pressed="true">Month</button>
    <button class="chip" data-range="quarter" aria-pressed="false">BAS quarter</button>
    <button class="chip" data-range="fy" aria-pressed="false">Financial year</button>
    <button class="chip" data-range="all" aria-pressed="false">All time</button>
  </div>
</header>

<main>
  <section id="tab-home"></section>

  <section id="tab-records" hidden>
    <div class="seg" id="recView">
      <button data-v="tx" aria-pressed="true">Transactions</button>
      <button data-v="rc" aria-pressed="false">Receipts</button>
    </div>
    <div class="tools" id="txTools">
      <div class="chips" id="recFilter">
        <button class="chip" data-f="all" aria-pressed="true">All</button>
        <button class="chip" data-f="income" aria-pressed="false">Income</button>
        <button class="chip" data-f="expense" aria-pressed="false">Expenses</button>
      </div>
      <input id="recSearch" type="search" placeholder="Search" aria-label="Search transactions">
    </div>
    <div class="card" id="recList"></div>
  </section>

  <section id="tab-gst" hidden></section>
  <section id="tab-data" hidden></section>
</main>

<button class="fab" id="fab" data-act="add-sheet" hidden>+ Add</button>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button role="tab" data-tab="records" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Records</button>
  <button role="tab" data-tab="gst" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>GST &amp; reports</button>
  <button role="tab" data-tab="data" aria-selected="false"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Backup</button>
</nav>

<div class="scrim" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" id="sheetClose" aria-label="Close">&#10005;</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="scrim center-scrim" id="dlg" hidden>
  <div class="dlg-card" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle" aria-describedby="dlgMsg">
    <h3 id="dlgTitle"></h3><p id="dlgMsg"></p>
    <div class="sticky-actions"><button class="btn alt" id="dlgNo"></button><button class="btn" id="dlgYes"></button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<input id="fPdf" type="file" accept="application/pdf,.pdf" multiple hidden>
<input id="fImg" type="file" accept="image/*" hidden>
<input id="fJson" type="file" accept="application/json,.json" hidden>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD"}).format(Number(v||0));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;   /* local date, not UTC */
const today=()=>iso(new Date());
const num=v=>{const n=Number(String(v??"").replace(/[$,A\s]/g,""));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const hashText=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)};
const shortDate=d=>d.toLocaleDateString("en-AU",{day:"numeric",month:"short"});
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------- database (same name/version/stores as V1-V4, so existing data keeps working) ---------- */
const DB_NAME="RideLedgerDB",DB_VERSION=1;let db;
function openDb(){return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=()=>{const d=req.result;
    if(!d.objectStoreNames.contains("transactions")){const s=d.createObjectStore("transactions",{keyPath:"id",autoIncrement:true});s.createIndex("date","date");s.createIndex("platform","platform");s.createIndex("importHash","importHash",{unique:false})}
    if(!d.objectStoreNames.contains("receipts")){const s=d.createObjectStore("receipts",{keyPath:"id",autoIncrement:true});s.createIndex("date","date")}};
  req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)})}
const st=(n,m="readonly")=>db.transaction(n,m).objectStore(n);

function startOfWeek(d){const x=new Date(d);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);x.setHours(0,0,0,0);return x}
function period(){
  const now=new Date();let start,end,label;
  if(range==="week"){start=startOfWeek(now);start.setDate(start.getDate()+offset*7);end=new Date(start);end.setDate(end.getDate()+6);
    label=offset===0?"This week":`${shortDate(start)} to ${shortDate(end)}`}
  else if(range==="month"){start=new Date(now.getFullYear(),now.getMonth()+offset,1);end=new Date(start.getFullYear(),start.getMonth()+1,0);
    label=start.toLocaleString("en-AU",{month:"long",year:"numeric"})}
  else if(range==="quarter"){const q=Math.floor(now.getMonth()/3)+offset;start=new Date(now.getFullYear(),q*3,1);end=new Date(start.getFullYear(),start.getMonth()+3,0);
    const m=start.getMonth(),fyStart=m>=6?start.getFullYear():start.getFullYear()-1,bq=m>=6?Math.floor((m-6)/3)+1:Math.floor((m+6)/3)+1;
    label=`Q${bq} FY${String(fyStart).slice(-2)}/${String(fyStart+1).slice(-2)}`;
    var sub=`${start.toLocaleString("en-AU",{month:"short"})} to ${end.toLocaleString("en-AU",{month:"short",year:"numeric"})}`}
  else if(range==="fy"){const sy=(now.getMonth()>=6?now.getFullYear():now.getFullYear()-1)+offset;start=new Date(sy,6,1);end=new Date(sy+1,5,30);label=`FY ${sy}/${String(sy+1).slice(-2)}`}
  else{start=new Date(2000,0,1);end=new Date(2100,0,1);label="All time"}
  return{start,end,s:iso(start),e:iso(end),label,sub:sub||""}}
const inPeriod=(x,p)=>x.date&&x.date>=p.s&&x.date<=p.e;
const periodTx=()=>{const p=period();return state.tx.filter(x=>inPeriod(x,p))};
const rangeText=p=>range==="all"?"Every record on this device":`${p.s} to ${p.e}`;

function summarize(list){
  const inc=list.filter(x=>x.type==="income"),exp=list.filter(x=>x.type==="expense");
  const uber=sum(inc.filter(x=>x.platform==="Uber"),x=>num(x.amount)),didi=sum(inc.filter(x=>x.platform==="DiDi"),x=>num(x.amount));
  const income=sum(inc,x=>num(x.amount)),expenses=sum(exp,x=>num(x.amount));
  const fees=sum(exp.filter(x=>/platform fee/i.test(x.description||"")),x=>num(x.amount));
  const other=Math.max(0,expenses-fees);
  const g1=sum(inc.filter(x=>x.includeG1!==false),x=>num(x.amount));
  const oneA=sum(inc,x=>num(x.gst)),oneB=sum(exp,x=>num(x.gst)),gst=oneA-oneB;
  const uberCharges=sum(exp.filter(x=>x.platform==="Uber"),x=>num(x.amount)),didiCharges=sum(exp.filter(x=>x.platform==="DiDi"),x=>num(x.amount));
  return{income,expenses,fees,other,g1,oneA,oneB,gst,uber,didi,uberCharges,didiCharges,uberNet:uber-uberCharges,didiNet:didi-didiCharges,
    real:income-expenses-gst,km:sum(inc,x=>num(x.km)),count:list.length}}

/* ---------- PDF reading (PDF.js loads only when needed) ---------- */
let pdfjsP;
function loadPdfJs(){
  const got=()=>window.pdfjsLib||window["pdfjs-dist/build/pdf"];
  if(got())return Promise.resolve(got());
  if(!pdfjsP)pdfjsP=new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{
      const lib=got();
      if(!lib){pdfjsP=null;rej(new Error("The PDF reader loaded but was not in the expected format. Try again."));return}
      window.pdfjsLib=lib;
      lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      res(lib)};
    s.onerror=()=>{pdfjsP=null;rej(new Error("The PDF reader could not load. Check your internet connection and try again."))};document.head.appendChild(s)});
  return pdfjsP}
async function readPdfText(file){
  const lib=await loadPdfJs();const data=new Uint8Array(await file.arrayBuffer());
  const pdf=await lib.getDocument({data}).promise;let text="";
  for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();text+=c.items.map(x=>x.str).join(" ")+"\n"}
  return text}
const match=(t,rx)=>{const m=t.match(rx);return m?m[1].trim():""};
function parseDiDi(text){
  const period=match(text,/Tax Summary for the Period\s+(\d{2}\/\d{4})/i);
  const gross=num(match(text,/Gross Rider Fares\s+A?\$?\s*([\d,]+\.\d{2})/i));
  const rewards=num(match(text,/Rewards\s+A?\$?\s*([\d,]+\.\d{2})/i));
  const fee=num(match(text,/DiDi Service Fee\s+A?\$?\s*([\d,]+\.\d{2})/i));
  const km=num(match(text,/ON TRIP DISTANCE\s+([\d,.]+)\s*Km/i));
  let date=today();if(period){const [mm,yy]=period.split("/");date=`${yy}-${mm}-01`}
  return{date,gross,rewards,fee,km,period}}
function parseUber(text){
  const period=match(text,/Weekly Statement\s+(\d{1,2}\s*[A-Za-z]{3},\s*\d{4}\s*\d{1,2}(?:am|pm)\s*-\s*\d{1,2}\s*[A-Za-z]{3},\s*\d{4}\s*\d{1,2}(?:am|pm))/i)
    ||match(text,/(\d{1,2}\s*[A-Za-z]{3},\s*\d{4}\s*\d{1,2}(?:am|pm)\s*-\s*\d{1,2}\s*[A-Za-z]{3},\s*\d{4}\s*\d{1,2}(?:am|pm))/i);
  const earnings=num(match(text,/Your earnings\s+\$?\s*([\d,]+\.\d{2})/i));
  const fare=num(match(text,/Breakdown of Your earnings[\s\S]*?Fare\s+\$?\s*([\d,]+\.\d{2})/i));
  const serviceFee=Math.abs(num(match(text,/Service Fee\s+-?\$?\s*([\d,]+\.\d{2})/i)));
  const tips=num(match(text,/Tip\s+\$?\s*([\d,]+\.\d{2})/i));
  const refunds=Math.abs(num(match(text,/Refunds\s*&\s*Expenses\s+-?\$?\s*([\d,]+\.\d{2})/i)));
  const payouts=num(match(text,/Payouts\s+\$?\s*([\d,]+\.\d{2})/i));
  let date=today();const dm=text.match(/(\d{1,2})\s*([A-Za-z]{3}),\s*(\d{4})/i);
  if(dm){const M={Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"};
    date=`${dm[3]}-${M[dm[2][0].toUpperCase()+dm[2].slice(1,3).toLowerCase()]||"01"}-${pad(dm[1])}`}
  return{period,date,earnings,fare,serviceFee,tips,refunds,payouts}}
const isUberMonthly=t=>/uber/i.test(t)&&/tax summary/i.test(t)&&/transportation income/i.test(t)&&!/weekly statement/i.test(t);
const MONTHS3={January:"01",February:"02",March:"03",April:"04",May:"05",June:"06",July:"07",August:"08",September:"09",October:"10",November:"11",December:"12"};
function parseUberMonthly(text){
  const pm=text.match(/(\d{1,2})\s*-\s*(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
  const period=pm?`${pm[1]}-${pm[2]} ${pm[3]} ${pm[4]}`:"";
  const date=pm?`${pm[4]}-${MONTHS3[pm[3]]||"01"}-01`:today();
  const transportIncome=num(match(text,/(?<!Total )Transportation income\s*\$?([\d,]+\.\d{2})/i))||num(match(text,/Transportation income\s*\$?([\d,]+\.\d{2})/i));
  const deliveryIncome=num(match(text,/Delivery income\s*\$?([\d,]+\.\d{2})/i));
  const otherIncome=num(match(text,/Other Income\s*\$?([\d,]+\.\d{2})/i));
  const serviceFee=num(match(text,/Uber service fee[^$]{0,40}\$?([\d,]+\.\d{2})/i));
  const otherCharges=num(match(text,/Other charges from Uber\s*\$?([\d,]+\.\d{2})/i));
  const km=num(match(text,/([\d,.]+)\s*km[\s\S]{0,20}?On[\s-]?Trip Mileage/i));
  const trips=num(match(text,/(\d+)[\s\S]{0,10}?\bTrips\b/i));
  return{period,date,transportIncome,deliveryIncome,otherIncome,serviceFee,otherCharges,km,trips}}
const detectKind=t=>/tax summary for the period|didi/i.test(t)?"DiDi":/weekly statement|uber|tax summary/i.test(t)?"Uber":null;

const csvEsc=v=>`"${String(v??"").replaceAll('"','""')}"`;
function csvBlob(list){const rows=[["Date","Type","Platform","Category","Description","Amount","GST"],...[...list].sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(x=>[x.date,x.type,x.platform,x.category||"",x.description,x.amount,x.gst])];
  return new Blob(["\uFEFF"+rows.map(r=>r.map(csvEsc).join(",")).join("\r\n")],{type:"text/csv"})}
const fileSlug=()=>period().label.replace(/[^A-Za-z0-9]+/g,"_");

/* ---------- backup / restore ---------- */
async function doBackup(){
  const data={app:"RideLedger",version:2,exportedAt:new Date().toISOString(),transactions:state.tx,receipts:state.rc};
  const ok=await saveFile(`RideLedger_backup_${today()}.json`,new Blob([JSON.stringify(data)],{type:"application/json"}));
  if(ok){lsSet("rl_lastBackup",String(Date.now()));renderHome();renderData()}}
async function doRestore(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast("That file is not a valid backup");return}
  if(!data||!Array.isArray(data.transactions)){toast("That file is not a RideLedger backup");return}
  const rc=Array.isArray(data.receipts)?data.receipts:[];
  openSheet("Restore backup",`<p>This backup has <b>${data.transactions.length}</b> transactions and <b>${rc.length}</b> receipts${data.exportedAt?`, saved ${esc(new Date(data.exportedAt).toLocaleDateString("en-AU"))}`:""}.</p>
    <div class="btns" style="flex-direction:column"><button class="btn main block" id="rMerge">Add to what is here</button><button class="btn danger block" id="rReplace">Replace everything on this device</button><button class="btn alt block" id="rNo">Cancel</button></div>
    <p class="muted">Adding skips records that already exist.</p>`);
  $("rNo").onclick=()=>closeSheet();
  $("rMerge").onclick=async()=>{
    const sig=x=>[x.date,x.type,x.platform,x.description,x.amount,x.gst].join("|"),have=new Set(state.tx.map(sig)),map=new Map();let n=0;
    for(const r of rc){const {id,...rest}=r;const nid=await add("receipts",rest);map.set(id,nid)}
    for(const t of data.transactions){if(have.has(sig(t)))continue;const {id,...rest}=t;if(rest.receiptId!=null)rest.receiptId=map.get(rest.receiptId)??rest.receiptId;await add("transactions",rest);n++}
    closeSheet(true);toast(`Added ${n} transactions`);refresh()};
  $("rReplace").onclick=async()=>{
    if(!await askConfirm({title:"Replace everything?",message:"All current records on this device will be deleted first.",ok:"Replace",danger:true}))return;
    await clearStore("transactions");await clearStore("receipts");
    for(const r of rc)await put("receipts",r);for(const t of data.transactions)await put("transactions",t);
    closeSheet(true);toast("Backup restored");refresh()}}

/* ---------- events ---------- */
let pendingKind="Uber";
function pickPdf(k){pendingKind=k;closeSheet(true);$("fPdf").click()}
function addSheet(){openSheet("Add",`<div class="list">
  ${[["import-uber","Import Uber PDF","Weekly statement"],["import-didi","Import DiDi PDF","Monthly tax summary"],["import-bank","Import bank PDF","Enter the line you need"],["scan","Scan a receipt","Photo, category and GST"],["manual","Add by hand","Income or expense"]].map(([a,t,s])=>`<button class="row" data-act="${a}"><span class="row-main"><b>${t}</b><small>${s}</small></span></button>`).join("")}</div>`)}
document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-act]");
  if(a){const act=a.dataset.act;
    if(act==="import-uber")pickPdf("Uber");else if(act==="import-didi")pickPdf("DiDi");else if(act==="import-bank")pickPdf("Bank");
    else if(act==="scan"){closeSheet(true);$("fImg").click()}
    else if(act==="manual"){closeSheet(true);openTxForm(null)}
    else if(act==="add-sheet")addSheet();
    else if(act==="backup")doBackup();
    else if(act==="restore")$("fJson").click();
    else if(act==="csv-period")saveFile(`RideLedger_${fileSlug()}.csv`,csvBlob(periodTx()));
    else if(act==="csv-all")saveFile("RideLedger_all_transactions.csv",csvBlob(state.tx));
    else if(act==="pdf-full")saveFile(`RideLedger_${fileSlug()}.pdf`,reportDoc("RideLedger report",true));
    else if(act==="pdf-acc")saveFile(`RideLedger_Accountant_Pack_${fileSlug()}.pdf`,reportDoc("RideLedger accountant pack",false));
    else if(act==="fill-gst"){const p=period(),l=periodTx().filter(x=>x.type==="income"&&(x.platform==="Uber"||x.platform==="DiDi")&&!num(x.gst)&&num(x.amount)>0);
      if(await askConfirm({title:"Fill GST at 1/11?",message:`This sets GST to one eleventh of the amount on ${l.length} income record${l.length>1?"s":""} in ${p.label}. You can edit any of them afterwards.`,ok:"Fill GST"})){for(const x of l)await put("transactions",{...x,gst:r2(num(x.amount)/11)});toast("GST filled");refresh()}}
    else if(act==="clear"){if(await askConfirm({title:"Delete everything?",message:"Every transaction and receipt on this device will be removed. This cannot be undone.",ok:"Delete everything",danger:true})){await clearStore("transactions");await clearStore("receipts");toast("All data deleted");refresh()}}
    return}
  const tx=e.target.closest("[data-tx]");if(tx){const x=state.tx.find(t=>String(t.id)===tx.dataset.tx);if(x)openTxForm(x);return}
  const rc=e.target.closest("[data-rc]");if(rc){const r=state.rc.find(t=>String(t.id)===rc.dataset.rc);if(r)openReceipt(r)}});
document.querySelectorAll("#ranges .chip").forEach(b=>b.onclick=()=>{range=b.dataset.range;offset=0;renderAll()});
$("pPrev").onclick=()=>{offset--;renderAll()};$("pNext").onclick=()=>{if(offset<0){offset++;renderAll()}};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.querySelectorAll("#recView button").forEach(b=>b.onclick=()=>{recView=b.dataset.v;renderRecords()});
document.querySelectorAll("#recFilter .chip").forEach(b=>b.onclick=()=>{recFilter=b.dataset.f;renderRecords()});
$("recSearch").oninput=e=>{recQuery=e.target.value.trim().toLowerCase();renderRecords()};
$("fPdf").onchange=e=>{const f=[...e.target.files];e.target.value="";if(f.length)startQueue(f,pendingKind)};
$("fJson").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)doRestore(f)};
$("fImg").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{openReceipt({imageData:await toDataUrl(f),date:today(),category:"Fuel"})}catch(err){toast(err.message||"Could not read this photo")}};

/* ---------- start ---------- */
(async()=>{
  try{await openDb();await refresh()}catch(e){$("tab-home").innerHTML=`<div class="card"><h2>Storage is unavailable</h2><p class="muted">This browser blocked local storage, so RideLedger cannot save anything. Open it in Safari or Chrome outside private mode.</p></div>`}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("./service-worker.js").catch(()=>{})}catch(e){}
})();
</script>
</body>
</html>
